aid: codeberg
url: https://raw.githubusercontent.com/api-evangelist/codeberg/refs/heads/main/apis.yml
name: Codeberg
kind: company
description: Codeberg is a community-run, non-profit platform for hosting Git
  repositories and collaborating on free and open source software, operated by the
  Codeberg e.V. association in Germany. It runs on Forgejo (a community fork of
  Gitea) and exposes the Forgejo/Gitea-compatible REST API at
  https://codeberg.org/api/v1 for repositories, issues, pull requests, releases,
  Git content, users, and organizations. Access is free and donation-funded;
  requests authenticate with a personal access token or OAuth2.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Code Hosting
- Git
- Git Hosting
- Version Control
- Repositories
- Pull Requests
- Issue Tracking
- Open Source
- Forgejo
- Non-Profit
