          type: string
          x-go-name: Website
      x-go-package: forgejo.org/modules/structs
    APINotFound:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
          x-go-name: Errors
        message:
          type: string
          x-go-name: Message
        url:
          type: string
          x-go-name: URL
