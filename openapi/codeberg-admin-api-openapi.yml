openapi: 3.2.0
info:
  description: This documentation describes the Forgejo API.
  title: Forgejo Admin API
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: http://opensource.org/licenses/MIT
  version: 16.0.0-dev-785-465b60ef+gitea-1.22.0
servers:
- url: /api/v1
security:
- BasicAuth: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- name: Admin
paths:
  /admin/actions/runners:
    get:
      tags:
      - Admin
      summary: Get all runners, no matter whether they are global runners or scoped to an…
      operationId: getAdminRunners
      parameters:
      - description: whether to include all visible runners (true) or only those that are directly owned by the instance (false)
        name: visible
        in: query
        schema:
          type: boolean
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActionRunnerList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    post:
      tags:
      - Admin
      summary: Register a new global runner
      operationId: registerAdminRunner
      responses:
        '201':
          $ref: '#/components/responses/RegisterRunnerResponse'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRunnerOptions'
  /admin/actions/runners/jobs:
    get:
      tags:
      - Admin
      summary: Get action run jobs
      operationId: adminGetActionRunJobs
      parameters:
      - description: a comma separated list of labels to search for
        name: labels
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RunJobList'
        '403':
          $ref: '#/components/responses/forbidden'
  /admin/actions/runners/registration-token:
    get:
      description: This operation has been deprecated in Forgejo 15. Use the web UI or `/admin/actions/runners` instead.
      tags:
      - Admin
      summary: Get a runner registration token for registering global runners
      operationId: adminGetRunnerRegistrationToken
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/RegistrationToken'
  /admin/actions/runners/{runner_id}:
    get:
      tags:
      - Admin
      summary: Get a particular runner, no matter whether it is a global runner or scoped to…
      operationId: getAdminRunner
      parameters:
      - description: ID of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActionRunner'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Admin
      summary: Delete a particular runner, no matter whether it is a global runner or scoped…
      operationId: deleteAdminRunner
      parameters:
      - description: ID of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: runner has been deleted
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /admin/cron:
    get:
      tags:
      - Admin
      summary: List cron tasks
      operationId: adminCronList
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/CronList'
        '403':
          $ref: '#/components/responses/forbidden'
  /admin/cron/{task}:
    post:
      tags:
      - Admin
      summary: Run cron task
      operationId: adminCronRun
      parameters:
      - description: task to run
        name: task
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
  /admin/emails:
    get:
      tags:
      - Admin
      summary: List all users' email addresses
      operationId: adminGetAllEmails
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/EmailList'
        '403':
          $ref: '#/components/responses/forbidden'
  /admin/emails/search:
    get:
      tags:
      - Admin
      summary: Search users' email addresses
      operationId: adminSearchEmails
      parameters:
      - description: keyword
        name: q
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/EmailList'
        '403':
          $ref: '#/components/responses/forbidden'
  /admin/hooks:
    get:
      tags:
      - Admin
      summary: List global (system) webhooks
      operationId: adminListHooks
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/HookListWithoutPagination'
    post:
      tags:
      - Admin
      summary: Create a hook
      operationId: adminCreateHook
      responses:
        '201':
          $ref: '#/components/responses/Hook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHookOption'
        required: true
  /admin/hooks/{id}:
    get:
      tags:
      - Admin
      summary: Get a hook
      operationId: adminGetHook
      parameters:
      - description: id of the hook to get
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Hook'
    delete:
      tags:
      - Admin
      summary: Delete a hook
      operationId: adminDeleteHook
      parameters:
      - description: id of the hook to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
    patch:
      tags:
      - Admin
      summary: Update a hook
      operationId: adminEditHook
      parameters:
      - description: id of the hook to update
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Hook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditHookOption'
  /admin/orgs:
    get:
      tags:
      - Admin
      summary: List all organizations
      operationId: adminGetAllOrgs
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/OrganizationList'
        '403':
          $ref: '#/components/responses/forbidden'
  /admin/quota/groups:
    get:
      tags:
      - Admin
      summary: List the available quota groups
      operationId: adminListQuotaGroups
      responses:
        '200':
          $ref: '#/components/responses/QuotaGroupList'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - Admin
      summary: Create a new quota group
      operationId: adminCreateQuotaGroup
      responses:
        '201':
          $ref: '#/components/responses/QuotaGroup'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          $ref: '#/components/responses/error'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotaGroupOptions'
          text/plain:
            schema:
              $ref: '#/components/schemas/CreateQuotaGroupOptions'
        description: Definition of the quota group
        required: true
  /admin/quota/groups/{quotagroup}:
    get:
      tags:
      - Admin
      summary: Get information about the quota group
      operationId: adminGetQuotaGroup
      parameters:
      - description: quota group to query
        name: quotagroup
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/QuotaGroup'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Admin
      summary: Delete a quota group
      operationId: adminDeleteQuotaGroup
      parameters:
      - description: quota group to delete
        name: quotagroup
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /admin/quota/groups/{quotagroup}/rules/{quotarule}:
    put:
      tags:
      - Admin
      summary: Adds a rule to a quota group
      operationId: adminAddRuleToQuotaGroup
      parameters:
      - description: quota group to add a rule to
        name: quotagroup
        in: path
        required: true
        schema:
          type: string
      - description: the name of the quota rule to add to the group
        name: quotarule
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/error'
        '422':
          $ref: '#/components/responses/validationError'
    delete:
      tags:
      - Admin
      summary: Removes a rule from a quota group
      operationId: adminRemoveRuleFromQuotaGroup
      parameters:
      - description: quota group to remove a rule from
        name: quotagroup
        in: path
        required: true
        schema:
          type: string
      - description: the name of the quota rule to remove from the group
        name: quotarule
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/empty'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /admin/quota/groups/{quotagroup}/users:
    get:
      tags:
      - Admin
      summary: List users in a quota group
      operationId: adminListUsersInQuotaGroup
      parameters:
      - description: quota group to list members of
        name: quotagroup
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UserList'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /admin/quota/groups/{quotagroup}/users/{username}:
    put:
      tags:
      - Admin
      summary: Add a user to a quota group
      operationId: adminAddUserToQuotaGroup
      parameters:
      - description: quota group to add the user to
        name: quotagroup
        in: path
        required: true
        schema:
          type: string
      - description: username of the user to add to the quota group
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/error'
        '422':
          $ref: '#/components/responses/validationError'
    delete:
      tags:
      - Admin
      summary: Remove a user from a quota group
      operationId: adminRemoveUserFromQuotaGroup
      parameters:
      - description: quota group to remove a user from
        name: quotagroup
        in: path
        required: true
        schema:
          type: string
      - description: username of the user to remove from the quota group
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /admin/quota/rules:
    get:
      tags:
      - Admin
      summary: List the available quota rules
      operationId: adminListQuotaRules
      responses:
        '200':
          $ref: '#/components/responses/QuotaRuleInfoList'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - Admin
      summary: Create a new quota rule
      operationId: adminCreateQuotaRule
      responses:
        '201':
          $ref: '#/components/responses/QuotaRuleInfo'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          $ref: '#/components/responses/error'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotaRuleOptions'
          text/plain:
            schema:
              $ref: '#/components/schemas/CreateQuotaRuleOptions'
        description: Definition of the quota rule
        required: true
  /admin/quota/rules/{quotarule}:
    get:
      tags:
      - Admin
      summary: Get information about a quota rule
      operationId: adminGetQuotaRule
      parameters:
      - description: quota rule to query
        name: quotarule
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/QuotaRuleInfo'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Admin
      summary: Deletes a quota rule
      operationId: adminDeleteQuotaRule
      parameters:
      - description: quota rule to delete
        name: quotarule
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - Admin
      summary: Change an existing quota rule
      operationId: adminEditQuotaRule
      parameters:
      - description: Quota rule to change
        name: quotarule
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/QuotaRuleInfo'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditQuotaRuleOptions'
          text/plain:
            schema:
              $ref: '#/components/schemas/EditQuotaRuleOptions'
        required: true
  /admin/runners/jobs:
    get:
      description: This operation has been deprecated in Forgejo 15. Use `/admin/actions/runners/jobs` instead.
      tags:
      - Admin
      summary: Search action jobs according to filter conditions
      operationId: adminSearchRunJobs
      deprecated: true
      parameters:
      - description: a comma separated list of run job labels to search for
        name: labels
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RunJobList'
        '403':
          $ref: '#/components/responses/forbidden'
  /admin/runners/registration-token:
    get:
      description: This operation has been deprecated in Forgejo 15. Use the web UI or `/admin/actions/runners` instead.
      tags:
      - Admin
      summary: Get a runner registration token for registering global runners
      operationId: adminGetRegistrationToken
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/RegistrationToken'
  /admin/unadopted:
    get:
      tags:
      - Admin
      summary: List unadopted repositories
      operationId: adminUnadoptedList
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      - description: pattern of repositories to search for
        name: pattern
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/StringSlice'
        '403':
          $ref: '#/components/responses/forbidden'
  /admin/unadopted/{owner}/{repo}:
    post:
      tags:
      - Admin
      summary: Adopt unadopted files as a repository
      operationId: adminAdoptRepository
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Admin
      summary: Delete unadopted files
      operationId: adminDeleteUnadoptedRepository
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
  /admin/users:
    get:
      tags:
      - Admin
      summary: Search users according filter conditions
      operationId: adminSearchUsers
      parameters:
      - description: ID of the user's login source to search for
        name: source_id
        in: query
        schema:
          type: integer
          format: int64
      - description: user's login name to search for
        name: login_name
        in: query
        schema:
          type: string
      - description: whether or not to filter users with the 2fa enabled
        name: is_2fa_enabled
        in: query
        schema:
          type: boolean
      - description: sort order of results
        name: sort
        in: query
        schema:
          type: string
          enum:
          - oldest
          - newest
          - alphabetically
          - reversealphabetically
          - recentupdate
          - leastupdate
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/UserList'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - Admin
      summary: Create a user account
      operationId: adminCreateUser
      responses:
        '201':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserOption'
  /admin/users/{username}:
    delete:
      tags:
      - Admin
      summary: Delete user account
      operationId: adminDeleteUser
      parameters:
      - description: username of user to delete
        name: username
        in: path
        required: true
        schema:
          type: string
      - description: purge the user from the system completely
        name: purge
        in: query
        schema:
          type: boolean
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
    patch:
      tags:
      - Admin
      summary: Edit an existing user
      operationId: adminEditUser
      parameters:
      - description: username of user to edit
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditUserOption'
  /admin/users/{username}/emails:
    get:
      tags:
      - Admin
      summary: List all email addresses for a user
      operationId: adminListUserEmails
      parameters:
      - description: username of user to get email addresses of
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/EmailList'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Admin
      summary: Delete email addresses from a user's account
      operationId: adminDeleteUserEmails
      parameters:
      - description: username of user to delete email addresses from
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEmailOption'
          text/plain:
            schema:
              $ref: '#/components/schemas/DeleteEmailOption'
  /admin/users/{username}/keys:
    post:
      tags:
      - Admin
      summary: Add an SSH public key to user's account
      operationId: adminCreatePublicKey
      parameters:
      - description: username of the user
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/PublicKey'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyOption'
  /admin/users/{username}/keys/{id}:
    delete:
      tags:
      - Admin
      summary: Remove a public key from user's account
      operationId: adminDeleteUserPublicKey
      parameters:
      - description: username of user
