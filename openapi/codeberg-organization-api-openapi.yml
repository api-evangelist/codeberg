components:
  schemas:
    CreateVariableOption:
      type: object
      title: CreateVariableOption defines the properties of the variable to create.
      required:
      - value
      properties:
        value:
          description: 'Value of the variable to create. Special characters will be retained. Line endings will be normalized to LF to

            match the behaviour of browsers. Encode the data with Base64 if line endings should be retained.'
          type: string
          x-go-name: Value
      x-go-package: forgejo.org/modules/structs
    QuotaGroup:
      description: QuotaGroup represents a quota group
      type: object
      properties:
        name:
          description: Name of the group
          type: string
          x-go-name: Name
        rules:
          description: Rules associated with the group
          type: array
          items:
            $ref: '#/components/schemas/QuotaRuleInfo'
          x-go-name: Rules
      x-go-package: forgejo.org/modules/structs
    CreateHookOption:
      description: CreateHookOption options when create a hook
      type: object
      required:
      - type
      - config
      properties:
        active:
          type: boolean
          default: false
          x-go-name: Active
        authorization_header:
          type: string
          x-go-name: AuthorizationHeader
        branch_filter:
          type: string
          x-go-name: BranchFilter
        config:
          $ref: '#/components/schemas/CreateHookOptionConfig'
        events:
          type: array
          items:
            type: string
          x-go-name: Events
        type:
          type: string
          enum:
          - forgejo
          - dingtalk
          - discord
          - gitea
          - gogs
          - msteams
          - slack
          - telegram
          - feishu
          - wechatwork
          - packagist
          x-go-name: Type
      x-go-package: forgejo.org/modules/structs
    RepoTransfer:
      description: RepoTransfer represents a pending repo transfer
      type: object
      properties:
        doer:
          $ref: '#/components/schemas/User'
        recipient:
          $ref: '#/components/schemas/User'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
          x-go-name: Teams
      x-go-package: forgejo.org/modules/structs
    Label:
      description: Label a label to an issue or a pr
      type: object
      properties:
        color:
          type: string
          x-go-name: Color
          example: 00aabb
        description:
          type: string
          x-go-name: Description
        exclusive:
          type: boolean
          x-go-name: Exclusive
          example: false
        id:
          type: integer
          format: int64
          x-go-name: ID
        is_archived:
          type: boolean
          x-go-name: IsArchived
          example: false
        name:
          type: string
          x-go-name: Name
        url:
          type: string
          x-go-name: URL
      x-go-package: forgejo.org/modules/structs
    Secret:
      description: Secret represents a secret
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          x-go-name: Created
        name:
          description: the secret's name
          type: string
          x-go-name: Name
      x-go-package: forgejo.org/modules/structs
    RenameOrgOption:
      description: RenameOrgOption options when renaming an organization
      type: object
      required:
      - new_name
      properties:
        new_name:
          description: New username for this org. This name cannot be in use yet by any other user.
          type: string
          uniqueItems: true
          x-go-name: NewName
      x-go-package: forgejo.org/modules/structs
    ActionVariable:
      description: ActionVariable return value of the query API
      type: object
      properties:
        data:
          description: the value of the variable
          type: string
          x-go-name: Data
        name:
          description: the name of the variable
          type: string
          x-go-name: Name
        owner_id:
          description: the owner to which the variable belongs
          type: integer
          format: int64
          x-go-name: OwnerID
        repo_id:
          description: the repository to which the variable belongs
          type: integer
          format: int64
          x-go-name: RepoID
      x-go-package: forgejo.org/modules/structs
    CreateLabelOption:
      description: CreateLabelOption options for creating a label
      type: object
      required:
      - name
      - color
      properties:
        color:
          type: string
          x-go-name: Color
          example: '#00aabb'
        description:
          type: string
          x-go-name: Description
        exclusive:
          type: boolean
          x-go-name: Exclusive
          example: false
        is_archived:
          type: boolean
          x-go-name: IsArchived
          example: false
        name:
          type: string
          x-go-name: Name
      x-go-package: forgejo.org/modules/structs
    EditTeamOption:
      description: EditTeamOption options for editing a team
      type: object
      required:
      - name
      properties:
        can_create_org_repo:
          type: boolean
          x-go-name: CanCreateOrgRepo
        description:
          type: string
          x-go-name: Description
        includes_all_repositories:
          type: boolean
          x-go-name: IncludesAllRepositories
        name:
          type: string
          x-go-name: Name
        permission:
          type: string
          enum:
          - read
          - write
          - admin
          x-go-name: Permission
        units:
          type: array
          items:
            type: string
          x-go-name: Units
          example:
          - repo.code
          - repo.issues
          - repo.ext_issues
          - repo.wiki
          - repo.pulls
          - repo.releases
          - repo.projects
          - repo.ext_wiki
        units_map:
          type: object
          additionalProperties:
