openapi: 3.2.0
info:
  description: This documentation describes the Forgejo API.
  title: Forgejo Organization API
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: http://opensource.org/licenses/MIT
  version: 16.0.0-dev-785-465b60ef+gitea-1.22.0
servers:
- url: /api/v1
security:
- BasicAuth: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- name: Organization
paths:
  /org/{org}/repos:
    post:
      tags:
      - Organization
      summary: Create a repository in an organization
      operationId: createOrgRepoDeprecated
      deprecated: true
      parameters:
      - description: name of organization
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/Repository'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepoOption'
  /orgs:
    get:
      tags:
      - Organization
      summary: List all organizations
      operationId: orgGetAll
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/OrganizationList'
    post:
      tags:
      - Organization
      summary: Create an organization
      operationId: orgCreate
      responses:
        '201':
          $ref: '#/components/responses/Organization'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgOption'
        required: true
  /orgs/{org}:
    get:
      tags:
      - Organization
      summary: Get an organization
      operationId: orgGet
      parameters:
      - description: name of the organization to get
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Organization'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Organization
      summary: Delete an organization
      operationId: orgDelete
      parameters:
      - description: organization that is to be deleted
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - Organization
      summary: Edit an organization
      operationId: orgEdit
      parameters:
      - description: name of the organization to edit
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Organization'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditOrgOption'
        required: true
  /orgs/{org}/actions/runners:
    get:
      tags:
      - Organization
      summary: Get the organization's runners
      operationId: getOrgRunners
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: whether to include all visible runners (true) or only those that are directly owned by the organization (false)
        name: visible
        in: query
        schema:
          type: boolean
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActionRunnerList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    post:
      tags:
      - Organization
      summary: Register a new organization-level runner
      operationId: registerOrgRunner
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/RegisterRunnerResponse'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRunnerOptions'
  /orgs/{org}/actions/runners/jobs:
    get:
      tags:
      - Organization
      summary: Search for organization's action jobs according filter conditions
      operationId: orgSearchRunJobs
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: a comma separated list of run job labels to search for
        name: labels
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RunJobList'
        '403':
          $ref: '#/components/responses/forbidden'
  /orgs/{org}/actions/runners/registration-token:
    get:
      description: This operation has been deprecated in Forgejo 15. Use the web UI or `/orgs/{org}/actions/runners` instead.
      tags:
      - Organization
      summary: Get the organization's runner registration token
      operationId: orgGetRunnerRegistrationToken
      deprecated: true
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RegistrationToken'
  /orgs/{org}/actions/runners/{runner_id}:
    get:
      tags:
      - Organization
      summary: Get a particular runner that belongs to the organization
      operationId: getOrgRunner
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: ID of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActionRunner'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Organization
      summary: Delete a particular runner that belongs to the organization
      operationId: deleteOrgRunner
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: ID of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: runner has been deleted
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/actions/secrets:
    get:
      tags:
      - Organization
      summary: List actions secrets of an organization
      operationId: orgListActionsSecrets
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/SecretList'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/actions/secrets/{secretname}:
    put:
      tags:
      - Organization
      summary: Create or Update a secret value in an organization
      operationId: updateOrgSecret
      parameters:
      - description: name of organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: name of the secret
        name: secretname
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when creating a secret
        '204':
          description: response when updating a secret
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateSecretOption'
    delete:
      tags:
      - Organization
      summary: Delete a secret in an organization
      operationId: deleteOrgSecret
      parameters:
      - description: name of organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: name of the secret
        name: secretname
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: delete one secret of the organization
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/actions/variables:
    get:
      tags:
      - Organization
      summary: List variables of an organization
      operationId: getOrgVariablesList
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/VariableList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/actions/variables/{variablename}:
    get:
      tags:
      - Organization
      summary: Get organization's variable by name
      operationId: getOrgVariable
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActionVariable'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    put:
      tags:
      - Organization
      summary: Update variable in organization
      operationId: updateOrgVariable
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when updating an org-level variable
        '204':
          description: response when updating an org-level variable
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariableOption'
    post:
      tags:
      - Organization
      summary: Create a new variable in organization
      operationId: createOrgVariable
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when creating an org-level variable
        '204':
          description: response when creating an org-level variable
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariableOption'
    delete:
      tags:
      - Organization
      summary: Delete organization's variable by name
      operationId: deleteOrgVariable
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: response when deleting a variable
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/activities/feeds:
    get:
      tags:
      - Organization
      summary: List an organization's activity feeds
      operationId: orgListActivityFeeds
      parameters:
      - description: name of the org
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: the date of the activities to be found
        name: date
        in: query
        schema:
          type: string
          format: date
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActivityFeedsList'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/avatar:
    post:
      tags:
      - Organization
      summary: Update an organization's avatar
      operationId: orgUpdateAvatar
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserAvatarOption'
          text/plain:
            schema:
              $ref: '#/components/schemas/UpdateUserAvatarOption'
    delete:
      tags:
      - Organization
      summary: Delete an organization's avatar. It will be replaced by a default one
      operationId: orgDeleteAvatar
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/block/{username}:
    put:
      tags:
      - Organization
      summary: Blocks a user from the organization
      operationId: orgBlockUser
      parameters:
      - description: name of the org
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: username of the user
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
  /orgs/{org}/hooks:
    get:
      tags:
      - Organization
      summary: List an organization's webhooks
      operationId: orgListHooks
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/HookListWithoutPagination'
        '404':
          $ref: '#/components/responses/notFound'
    post:
      tags:
      - Organization
      summary: Create a hook
      operationId: orgCreateHook
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/Hook'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHookOption'
        required: true
  /orgs/{org}/hooks/{id}:
    get:
      tags:
      - Organization
      summary: Get a hook
      operationId: orgGetHook
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: id of the hook to get
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Hook'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Organization
      summary: Delete a hook
      operationId: orgDeleteHook
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: id of the hook to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - Organization
      summary: Update a hook
      operationId: orgEditHook
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: id of the hook to update
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Hook'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditHookOption'
  /orgs/{org}/labels:
    get:
      tags:
      - Organization
      summary: List an organization's labels
      operationId: orgListLabels
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: 'Specifies the sorting method: mostissues, leastissues, or reversealphabetically.'
        name: sort
        in: query
        schema:
          type: string
          enum:
          - mostissues
          - leastissues
          - reversealphabetically
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/LabelList'
        '404':
          $ref: '#/components/responses/notFound'
    post:
      tags:
      - Organization
      summary: Create a label for an organization
      operationId: orgCreateLabel
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/Label'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabelOption'
  /orgs/{org}/labels/{id}:
    get:
      tags:
      - Organization
      summary: Get a single label
      operationId: orgGetLabel
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: id of the label to get
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Label'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Organization
      summary: Delete a label
      operationId: orgDeleteLabel
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: id of the label to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - Organization
      summary: Update a label
      operationId: orgEditLabel
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: id of the label to edit
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Label'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditLabelOption'
  /orgs/{org}/list_blocked:
    get:
      tags:
      - Organization
      summary: List the organization's blocked users
      operationId: orgListBlockedUsers
      parameters:
      - description: name of the org
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/BlockedUserList'
  /orgs/{org}/members:
    get:
      tags:
      - Organization
      summary: List an organization's members
      operationId: orgListMembers
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/UserList'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/members/{username}:
    get:
      tags:
      - Organization
      summary: Check if a user is a member of an organization
      operationId: orgIsMember
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: username of the user
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: user is a member
        '303':
          description: redirection to /orgs/{org}/public_members/{username}
        '404':
          description: user is not a member
    delete:
      tags:
      - Organization
      summary: Remove a member from an organization
      operationId: orgDeleteMember
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: username of the user
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: member removed
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/public_members:
    get:
      tags:
      - Organization
      summary: List an organization's public members
      operationId: orgListPublicMembers
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/UserList'
        '404':
          $ref: '#/components/responses/notFound'
  /orgs/{org}/public_members/{username}:
    get:
      tags:
      - Organization
      summary: Check if a user is a public member of an organization
      operationId: orgIsPublicMember
      parameters:
      - description: name of the organization
        name: org
        in: path
        required: true
        schema:
          type: string
      - description: username of the user
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
