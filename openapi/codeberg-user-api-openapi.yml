openapi: 3.2.0
info:
  description: This documentation describes the Forgejo API.
  title: Forgejo User API
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: http://opensource.org/licenses/MIT
  version: 16.0.0-dev-785-465b60ef+gitea-1.22.0
servers:
- url: /api/v1
security:
- BasicAuth: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- name: User
paths:
  /user:
    get:
      tags:
      - User
      summary: Get the authenticated user
      operationId: userGetCurrent
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /user/actions/runners:
    get:
      tags:
      - User
      summary: Get the user's runners
      operationId: getUserRunners
      parameters:
      - description: whether to include all visible runners (true) or only those that are directly owned by the user (false)
        name: visible
        in: query
        schema:
          type: boolean
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActionRunnerList'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
    post:
      tags:
      - User
      summary: Register a new user-level runner
      operationId: registerUserRunner
      responses:
        '201':
          $ref: '#/components/responses/RegisterRunnerResponse'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRunnerOptions'
  /user/actions/runners/jobs:
    get:
      tags:
      - User
      summary: Search for user's action jobs according filter conditions
      operationId: userSearchRunJobs
      parameters:
      - description: a comma separated list of run job labels to search for
        name: labels
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RunJobList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /user/actions/runners/registration-token:
    get:
      description: This operation has been deprecated in Forgejo 15. Use the web UI or `/user/actions/runners` instead.
      tags:
      - User
      summary: Get the user's runner registration token
      operationId: userGetRunnerRegistrationToken
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/RegistrationToken'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /user/actions/runners/{runner_id}:
    get:
      tags:
      - User
      summary: Get a particular runner that belongs to the user
      operationId: getUserRunner
      parameters:
      - description: ID of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActionRunner'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: Delete a particular user-level runner
      operationId: deleteUserRunner
      parameters:
      - description: ID of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: runner has been deleted
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
  /user/actions/secrets/{secretname}:
    put:
      tags:
      - User
      summary: Create or Update a secret value in a user scope
      operationId: updateUserSecret
      parameters:
      - description: name of the secret
        name: secretname
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when creating a secret
        '204':
          description: response when updating a secret
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateSecretOption'
    delete:
      tags:
      - User
      summary: Delete a secret in a user scope
      operationId: deleteUserSecret
      parameters:
      - description: name of the secret
        name: secretname
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: delete one secret of the user
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /user/actions/variables:
    get:
      tags:
      - User
      summary: Get the user-level list of variables which is created by current doer
      operationId: getUserVariablesList
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/VariableList'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /user/actions/variables/{variablename}:
    get:
      tags:
      - User
      summary: Get a user-level variable which is created by current doer
      operationId: getUserVariable
      parameters:
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActionVariable'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    put:
      tags:
      - User
      summary: Update a user-level variable which is created by current doer
      operationId: updateUserVariable
      parameters:
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when updating a variable
        '204':
          description: response when updating a variable
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariableOption'
    post:
      tags:
      - User
      summary: Create a user-level variable
      operationId: createUserVariable
      parameters:
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when creating a variable
        '204':
          description: response when creating a variable
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariableOption'
    delete:
      tags:
      - User
      summary: Delete a user-level variable which is created by current doer
      operationId: deleteUserVariable
      parameters:
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when deleting a variable
        '204':
          description: response when deleting a variable
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /user/activitypub/follow:
    post:
      tags:
      - User
      summary: Follow a remote activitypub account
      operationId: userCurrentActivityPubFollow
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APRemoteFollowOption'
          text/plain:
            schema:
              $ref: '#/components/schemas/APRemoteFollowOption'
  /user/applications/oauth2:
    get:
      tags:
      - User
      summary: List the authenticated user's oauth2 applications
      operationId: userGetOAuth2Applications
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/OAuth2ApplicationList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - User
      summary: Creates a new OAuth2 application
      operationId: userCreateOAuth2Application
      responses:
        '201':
          $ref: '#/components/responses/OAuth2Application'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuth2ApplicationOptions'
          text/plain:
            schema:
              $ref: '#/components/schemas/CreateOAuth2ApplicationOptions'
        required: true
  /user/applications/oauth2/{id}:
    get:
      tags:
      - User
      summary: Get an OAuth2 application
      operationId: userGetOAuth2Application
      parameters:
      - description: Application ID to be found
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/OAuth2Application'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: Delete an OAuth2 application
      operationId: userDeleteOAuth2Application
      parameters:
      - description: token to be deleted
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - User
      summary: Update an OAuth2 application, this includes regenerating the client secret
      operationId: userUpdateOAuth2Application
      parameters:
      - description: application to be updated
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/OAuth2Application'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuth2ApplicationOptions'
          text/plain:
            schema:
              $ref: '#/components/schemas/CreateOAuth2ApplicationOptions'
        required: true
  /user/avatar:
    post:
      tags:
      - User
      summary: Update avatar of the current user
      operationId: userUpdateAvatar
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserAvatarOption'
          text/plain:
            schema:
              $ref: '#/components/schemas/UpdateUserAvatarOption'
    delete:
      tags:
      - User
      summary: Delete avatar of the current user. It will be replaced by a default one
      operationId: userDeleteAvatar
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /user/block/{username}:
    put:
      tags:
      - User
      summary: Blocks a user from the doer
      operationId: userBlockUser
      parameters:
      - description: username of the user
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
  /user/emails:
    get:
      tags:
      - User
      summary: List all email addresses of the current user
      operationId: userListEmails
      responses:
        '200':
          $ref: '#/components/responses/EmailList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - User
      summary: Add an email addresses to the current user's account
      operationId: userAddEmail
      responses:
        '201':
          $ref: '#/components/responses/EmailList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailOption'
          text/plain:
            schema:
              $ref: '#/components/schemas/CreateEmailOption'
    delete:
      tags:
      - User
      summary: Delete email addresses from the current user's account
      operationId: userDeleteEmail
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEmailOption'
          text/plain:
            schema:
              $ref: '#/components/schemas/DeleteEmailOption'
  /user/followers:
    get:
      tags:
      - User
      summary: List the authenticated user's followers
      operationId: userCurrentListFollowers
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/UserList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /user/following:
    get:
      tags:
      - User
      summary: List the users that the authenticated user is following
      operationId: userCurrentListFollowing
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/UserList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /user/following/{username}:
    get:
      tags:
      - User
      summary: Check whether a user is followed by the authenticated user
      operationId: userCurrentCheckFollowing
      parameters:
      - description: username of followed user
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    put:
      tags:
      - User
      summary: Follow a user
      operationId: userCurrentPutFollow
      parameters:
      - description: username of user to follow
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: Unfollow a user
      operationId: userCurrentDeleteFollow
      parameters:
      - description: username of user to unfollow
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /user/gpg_key_token:
    get:
      tags:
      - User
      summary: Get a Token to verify
      operationId: getVerificationToken
      responses:
        '200':
          $ref: '#/components/responses/string'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /user/gpg_key_verify:
    post:
      tags:
      - User
      summary: Verify a GPG key
      operationId: userVerifyGPGKey
      responses:
        '201':
          $ref: '#/components/responses/GPGKey'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyGPGKeyOption'
  /user/gpg_keys:
    get:
      tags:
      - User
      summary: List the authenticated user's GPG keys
      operationId: userCurrentListGPGKeys
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/GPGKeyList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - User
      summary: Add a GPG public key to current user's account
      operationId: userCurrentPostGPGKey
      responses:
        '201':
          $ref: '#/components/responses/GPGKey'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGPGKeyOption'
  /user/gpg_keys/{id}:
    get:
      tags:
      - User
      summary: Get a GPG key
      operationId: userCurrentGetGPGKey
      parameters:
      - description: id of key to get
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GPGKey'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: Remove a GPG public key from current user's account
      operationId: userCurrentDeleteGPGKey
      parameters:
      - description: id of key to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /user/hooks:
    get:
      tags:
      - User
      summary: List the authenticated user's webhooks
      operationId: userListHooks
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/HookListWithoutPagination'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - User
      summary: Create a hook
      operationId: userCreateHook
      responses:
        '201':
          $ref: '#/components/responses/Hook'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHookOption'
        required: true
  /user/hooks/{id}:
    get:
      tags:
      - User
      summary: Get a hook
      operationId: userGetHook
      parameters:
      - description: id of the hook to get
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Hook'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    delete:
      tags:
      - User
      summary: Delete a hook
      operationId: userDeleteHook
      parameters:
      - description: id of the hook to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    patch:
      tags:
      - User
      summary: Update a hook
      operationId: userEditHook
      parameters:
