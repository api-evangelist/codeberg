openapi: 3.2.0
info:
  description: This documentation describes the Forgejo API.
  title: Forgejo Repository API
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: http://opensource.org/licenses/MIT
  version: 16.0.0-dev-785-465b60ef+gitea-1.22.0
servers:
- url: /api/v1
security:
- BasicAuth: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- name: Repository
paths:
  /repos/migrate:
    post:
      tags:
      - Repository
      summary: Migrate a remote git repository
      operationId: repoMigrate
      responses:
        '201':
          $ref: '#/components/responses/Repository'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          description: The repository with the same name already exists.
        '413':
          $ref: '#/components/responses/quotaExceeded'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateRepoOptions'
  /repos/search:
    get:
      tags:
      - Repository
      summary: Search for repositories
      operationId: repoSearch
      parameters:
      - description: keyword
        name: q
        in: query
        schema:
          type: string
      - description: Limit search to repositories with keyword as topic
        name: topic
        in: query
        schema:
          type: boolean
      - description: include search of keyword within repository description
        name: includeDesc
        in: query
        schema:
          type: boolean
      - description: search only for repos that the user with the given id owns or contributes to
        name: uid
        in: query
        schema:
          type: integer
          format: int64
      - description: repo owner to prioritize in the results
        name: priority_owner_id
        in: query
        schema:
          type: integer
          format: int64
      - description: search only for repos that belong to the given team id
        name: team_id
        in: query
        schema:
          type: integer
          format: int64
      - description: search only for repos that the user with the given id has starred
        name: starredBy
        in: query
        schema:
          type: integer
          format: int64
      - description: include private repositories this user has access to (defaults to true)
        name: private
        in: query
        schema:
          type: boolean
      - description: show only public, private or all repositories (defaults to all)
        name: is_private
        in: query
        schema:
          type: boolean
      - description: show only template, non-template or all repositories (defaults to all)
        name: template
        in: query
        schema:
          type: boolean
      - description: show only archived, non-archived or all repositories (defaults to all)
        name: archived
        in: query
        schema:
          type: boolean
      - description: type of repository to search for. Supported values are "fork", "source", "mirror" and "collaborative"
        name: mode
        in: query
        schema:
          type: string
      - description: if `uid` is given, search only for repos that the user owns
        name: exclusive
        in: query
        schema:
          type: boolean
      - description: sort repos by attribute. Supported values are "alpha", "created", "updated", "size", "git_size", "lfs_size", "stars", "forks" and "id". Default is "alpha"
        name: sort
        in: query
        schema:
          type: string
          enum:
          - alpha
          - created
          - updated
          - size
          - git_size
          - lfs_size
          - id
          - stars
          - forks
      - description: sort order, either "asc" (ascending) or "desc" (descending). Default is "asc", ignored if "sort" is not specified.
        name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/SearchResults'
        '422':
          $ref: '#/components/responses/validationError'
  /repos/{owner}/{repo}:
    get:
      tags:
      - Repository
      summary: Get a repository
      operationId: repoGet
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Repository'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Repository
      summary: Delete a repository
      operationId: repoDelete
      parameters:
      - description: owner of the repo to delete
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo to delete
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - Repository
      summary: Edit a repository's properties. Only fields that are set will be changed
      operationId: repoEdit
      parameters:
      - description: owner of the repo to edit
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo to edit
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Repository'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRepoOption'
          text/plain:
            schema:
              $ref: '#/components/schemas/EditRepoOption'
        description: Properties of a repo that you can edit
  /repos/{owner}/{repo}/actions/artifacts:
    get:
      tags:
      - Repository
      summary: List a repository's artifacts
      operationId: ListActionArtifacts
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: filter by artifact name
        name: name
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results, default maximum page size is 50
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActionArtifactList'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
  /repos/{owner}/{repo}/actions/artifacts/{artifact_id}:
    get:
      tags:
      - Repository
      summary: Get an artifact by ID
      operationId: GetActionArtifact
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the artifact
        name: artifact_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ActionArtifact'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      description: 'Marks the artifact for deletion. Storage space will be reclaimed

        asynchronously by a background job.'
      tags:
      - Repository
      summary: Mark an artifact for deletion
      operationId: DeleteActionArtifact
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the artifact
        name: artifact_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: artifact marked for deletion
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/artifacts/{artifact_id}/zip:
    get:
      tags:
      - Repository
      summary: Download an artifact
      operationId: DownloadActionArtifact
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the artifact
        name: artifact_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: the artifact archive
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/jobs/{job_id}/logs:
    get:
      description: Returns the plaintext log for the job. By default the log for the most recent attempt is returned (ActionRunJob.TaskID tracks the latest task). Pass `?attempt=N` to fetch the log for a specific historical attempt; the value matches the `attempt` field returned by the job listing endpoints.
      tags:
      - Repository
      summary: Download the plaintext logs of an action job
      operationId: repoGetActionJobLogs
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the workflow job
        name: job_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: 1-based attempt number matching the value of `attempt` in the job listing; omit to fetch the latest attempt of the job
        name: attempt
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Plaintext log content
          content:
            text/plain:
              schema:
                type: string
        '206':
          description: Partial log content (Range request)
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runners:
    get:
      tags:
      - Repository
      summary: Get runners belonging to the repository
      operationId: getRepoRunners
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: whether to include all visible runners (true) or only those that are directly owned by the repository (false)
        name: visible
        in: query
        schema:
          type: boolean
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActionRunnerList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    post:
      tags:
      - Repository
      summary: Register a new repository-level runner
      operationId: registerRepoRunner
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/RegisterRunnerResponse'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRunnerOptions'
  /repos/{owner}/{repo}/actions/runners/jobs:
    get:
      tags:
      - Repository
      summary: Search for repository's action jobs according filter conditions
      operationId: repoSearchRunJobs
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: a comma separated list of run job labels to search for
        name: labels
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RunJobList'
        '403':
          $ref: '#/components/responses/forbidden'
  /repos/{owner}/{repo}/actions/runners/registration-token:
    get:
      description: This operation has been deprecated in Forgejo 15. Use the web UI or `/repos/{owner}/{repo}/actions/runners` instead.
      tags:
      - Repository
      summary: Get a repository's runner registration token
      operationId: repoGetRunnerRegistrationToken
      deprecated: true
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RegistrationToken'
  /repos/{owner}/{repo}/actions/runners/{runner_id}:
    get:
      tags:
      - Repository
      summary: Get a particular runner that belongs to the repository
      operationId: getRepoRunner
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActionRunner'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Repository
      summary: Delete a particular runner that belongs to a repository
      operationId: deleteRepoRunner
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: runner has been deleted
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs:
    get:
      tags:
      - Repository
      summary: List a repository's action runs
      operationId: ListActionRuns
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results, default maximum page size is 50
        name: limit
        in: query
        schema:
          type: integer
      - description: Returns workflow run triggered by the specified events. For example, `push`, `pull_request` or `workflow_dispatch`.
        name: event
        in: query
        schema:
          type: array
          items:
            type: string
      - description: 'Returns workflow runs with the check run status or conclusion that is specified. For example, a conclusion can be success or a status can be in_progress. Only Forgejo Actions can set a status of waiting, pending, or requested.

          '
        name: status
        in: query
        schema:
          type: array
          items:
            enum:
            - unknown
            - waiting
            - running
            - success
            - failure
            - cancelled
            - skipped
            - blocked
            type: string
      - description: 'Returns the workflow run associated with the run number.

          '
        name: run_number
        in: query
        schema:
          type: integer
          format: int64
      - description: Only returns workflow runs that are associated with the specified head_sha.
        name: head_sha
        in: query
        schema:
          type: string
      - description: Only return workflow runs that involve the given Git reference, for example, `refs/heads/main`.
        name: ref
        in: query
        schema:
          type: string
      - description: Only return workflow runs that involve the given workflow ID.
        name: workflow_id
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActionRunList'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
  /repos/{owner}/{repo}/actions/runs/{run_id}:
    get:
      tags:
      - Repository
      summary: Get an action run
      operationId: ActionRun
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the action run
        name: run_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ActionRun'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      description: Remove a particular workflow run. The workflow run must have completed (succeeded, failed, cancelled) for the operation to succeed. Otherwise, an error is returned.
      tags:
      - Repository
      summary: Delete a completed workflow run
      operationId: DeleteActionRun
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the action run
        name: run_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Workflow run has been removed
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts:
    get:
      tags:
      - Repository
      summary: List artifacts of a workflow run
      operationId: ListActionRunArtifacts
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the workflow run
        name: run_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: filter by artifact name
        name: name
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results, default maximum page size is 50
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActionArtifactList'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs/{run_id}/cancel:
    post:
      description: Cancel a particular workflow run. Pending or running jobs of the run are cancelled. A run that has already finished, whether cancelled, failed, skipped or succeeded, is left unchanged. In both cases the endpoint responds with HTTP 204.
      tags:
      - Repository
      summary: Cancel a pending or running workflow run
      operationId: CancelActionRun
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the workflow run
        name: run_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Workflow run has been cancelled
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs/{run_id}/jobs:
    get:
      tags:
      - Repository
      summary: List jobs of a workflow run
      operationId: ListActionRunJobs
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: ID of the workflow run
        name: run_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ActionRunJobList'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs/{run_id}/logs:
    get:
      tags:
      - Repository
      summary: Download a ZIP of plaintext logs for every job in an action run
      operationId: repoGetActionRunLogs
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: 'ID of the workflow run. The ZIP contains the latest attempt of each job in the run, with each entry named `{job-name}-{job-id}-attempt-{N}.log` (the job ID prevents collisions when two jobs share a name; the attempt number records which run the log came from). The run itself has no attempt number — jobs are re-run independently, so use the per-job logs endpoint with `?attempt` to fetch a specific historical attempt of one job.

          '
        name: run_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ZIP archive of per-job log files
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/secrets:
    get:
      tags:
      - Repository
      summary: List an repo's actions secrets
      operationId: repoListActionsSecrets
      parameters:
      - description: owner of the repository
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/SecretList'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/secrets/{secretname}:
    put:
      tags:
      - Repository
      summary: Create or Update a secret value in a repository
      operationId: updateRepoSecret
      parameters:
