components:
  schemas:
    CreateVariableOption:
      type: object
      title: CreateVariableOption defines the properties of the variable to create.
      required:
      - value
      properties:
        value:
          description: 'Value of the variable to create. Special characters will be retained. Line endings will be normalized to LF to

            match the behaviour of browsers. Encode the data with Base64 if line endings should be retained.'
          type: string
          x-go-name: Value
      x-go-package: forgejo.org/modules/structs
    IssueConfigValidation:
      type: object
      properties:
        message:
          type: string
          x-go-name: Message
        valid:
          type: boolean
          x-go-name: Valid
      x-go-package: forgejo.org/modules/structs
    DispatchWorkflowOption:
      description: DispatchWorkflowOption options when dispatching a workflow
      type: object
      required:
      - ref
      properties:
        inputs:
          description: Input keys and values configured in the workflow file.
          type: object
          additionalProperties:
            type: string
          x-go-name: Inputs
        ref:
          description: Git reference for the workflow
          type: string
          x-go-name: Ref
        return_run_info:
          description: Flag to return the run info
          type: boolean
          default: false
          x-go-name: ReturnRunInfo
      x-go-package: forgejo.org/modules/structs
    WikiCommit:
      description: WikiCommit page commit/revision
      type: object
      properties:
        author:
          $ref: '#/components/schemas/CommitUser'
        commiter:
          $ref: '#/components/schemas/CommitUser'
        message:
          type: string
          x-go-name: Message
        sha:
          type: string
          x-go-name: ID
      x-go-package: forgejo.org/modules/structs
    FileLinksResponse:
      description: FileLinksResponse contains the links for a repo's file
      type: object
      properties:
        git:
          type: string
          x-go-name: GitURL
        html:
          type: string
          x-go-name: HTMLURL
        self:
          type: string
          x-go-name: Self
      x-go-package: forgejo.org/modules/structs
    GitObject:
      type: object
      title: GitObject represents a Git object.
      properties:
        sha:
          type: string
          x-go-name: SHA
        type:
          type: string
          x-go-name: Type
        url:
          type: string
          x-go-name: URL
      x-go-package: forgejo.org/modules/structs
    IssueTemplate:
      description: IssueTemplate represents an issue template for a repository
      type: object
      properties:
        about:
          type: string
          x-go-name: About
        body:
          type: array
          items:
            $ref: '#/components/schemas/IssueFormField'
          x-go-name: Fields
        content:
          type: string
          x-go-name: Content
        file_name:
          type: string
          x-go-name: FileName
        labels:
          $ref: '#/components/schemas/IssueTemplateLabels'
        name:
          type: string
          x-go-name: Name
