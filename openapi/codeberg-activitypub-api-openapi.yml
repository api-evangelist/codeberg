openapi: 3.2.0
info:
  description: This documentation describes the Forgejo API.
  title: Forgejo Activitypub API
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: http://opensource.org/licenses/MIT
  version: 16.0.0-dev-785-465b60ef+gitea-1.22.0
servers:
- url: /api/v1
security:
- BasicAuth: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- name: activitypub
paths:
  /activitypub/actor:
    get:
      tags:
      - activitypub
      summary: Returns the instance's Actor
      operationId: activitypubInstanceActor
      responses:
        '200':
          $ref: '#/components/responses/ActivityPub'
  /activitypub/actor/inbox:
    post:
      tags:
      - activitypub
      summary: Send to the inbox
      operationId: activitypubInstanceActorInbox
      responses:
        '204':
          $ref: '#/components/responses/empty'
  /activitypub/actor/outbox:
    post:
      tags:
      - activitypub
      summary: Display the outbox (always empty)
      operationId: activitypubInstanceActorOutbox
      responses:
        '200':
          $ref: '#/components/responses/Outbox'
  /activitypub/repository-id/{repository-id}:
    get:
      tags:
      - activitypub
      summary: Returns the Repository actor for a repo
      operationId: activitypubRepository
      parameters:
      - description: repository ID of the repo
        name: repository-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ActivityPub'
  /activitypub/repository-id/{repository-id}/inbox:
    post:
      tags:
      - activitypub
      summary: Send to the inbox
      operationId: activitypubRepositoryInbox
      parameters:
      - description: repository ID of the repo
        name: repository-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgeLike'
          text/plain:
            schema:
              $ref: '#/components/schemas/ForgeLike'
  /activitypub/repository-id/{repository-id}/outbox:
    post:
      tags:
      - activitypub
      summary: Display the outbox
      operationId: activitypubRepositoryOutbox
      parameters:
      - description: repository ID of the repo
        name: repository-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Outbox'
  /activitypub/user-id/{user-id}:
    get:
      tags:
      - activitypub
      summary: Returns the Person actor for a user
      operationId: activitypubPerson
      parameters:
      - description: user ID of the user
        name: user-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ActivityPub'
  /activitypub/user-id/{user-id}/activities/{activity-id}:
    get:
      tags:
      - activitypub
      summary: Get a specific activity object of the user
      operationId: activitypubPersonActivityNote
      parameters:
      - description: user ID of the user
        name: user-id
        in: path
        required: true
        schema:
          type: integer
      - description: activity ID of the sought activity
        name: activity-id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActivityPub'
  /activitypub/user-id/{user-id}/activities/{activity-id}/activity:
    get:
      tags:
      - activitypub
      summary: Get a specific activity of the user
      operationId: activitypubPersonActivity
      parameters:
      - description: user ID of the user
        name: user-id
        in: path
        required: true
        schema:
          type: integer
      - description: activity ID of the sought activity
        name: activity-id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/ActivityPub'
  /activitypub/user-id/{user-id}/inbox:
    post:
      tags:
      - activitypub
      summary: Send to the inbox
      operationId: activitypubPersonInbox
      parameters:
      - description: user ID of the user
        name: user-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '202':
          $ref: '#/components/responses/empty'
  /activitypub/user-id/{user-id}/outbox:
    get:
      tags:
      - activitypub
      summary: List the user's recorded activity
      operationId: activitypubPersonFeed
      parameters:
      - description: user ID of the user
        name: user-id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/Outbox'
        '403':
          $ref: '#/components/responses/forbidden'
components:
  responses:
    forbidden:
      description: APIForbiddenError is a forbidden error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIForbiddenError'
        text/html:
          schema:
            $ref: '#/components/schemas/APIForbiddenError'
    ActivityPub:
      description: ActivityPub
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivityPub'
        text/html:
          schema:
            $ref: '#/components/schemas/ActivityPub'
    empty:
      description: APIEmpty is an empty response
    Outbox:
      description: Outbox
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeOutbox'
        text/html:
          schema:
            $ref: '#/components/schemas/ForgeOutbox'
  schemas:
    APIForbiddenError:
      type: object
      properties:
        message:
          type: string
          x-go-name: Message
        url:
          type: string
          x-go-name: URL
      x-go-package: forgejo.org/services/context
    ActivityPub:
      description: ActivityPub type
      type: object
      properties:
        '@context':
          type: string
          x-go-name: Context
      x-go-package: forgejo.org/modules/structs
    ForgeOutbox:
      description: ActivityStream OrderedCollection of activities
      type: object
      x-go-package: forgejo.org/modules/forgefed
    ForgeLike:
      description: ForgeLike activity data type
      type: object
      x-go-package: forgejo.org/modules/forgefed
  securitySchemes:
    AuthorizationHeaderToken:
      description: API tokens must be prepended with "token" followed by a space.
      type: apiKey
      name: Authorization
      in: header
    BasicAuth:
      type: http
      scheme: basic
    SudoHeader:
      description: Sudo API request as the user provided as the key. Admin privileges are required.
      type: apiKey
      name: Sudo
      in: header
    SudoParam:
      description: Sudo API request as the user provided as the key. Admin privileges are required.
      type: apiKey
      name: sudo
      in: query
    TOTPHeader:
      description: Must be used in combination with BasicAuth if two-factor authentication is enabled.
      type: apiKey
      name: X-FORGEJO-OTP
      in: header
x-provenance:
  method: harvested
  publisher: Codeberg
  source: https://codeberg.org/swagger.v1.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
