        '423':
          $ref: '#/components/responses/repoArchivedError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  description: attachment to upload
                  format: binary
              required:
              - attachment
