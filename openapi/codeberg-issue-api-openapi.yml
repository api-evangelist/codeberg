        required: true
        schema:
          type: string
      - description: id of the comment
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: name of the attachment
        name: name
        in: query
        schema:
          type: string
      - description: time of the attachment's creation. This is a timestamp in RFC 3339 format
        name: updated_at
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '201':
