openapi: 3.2.0
info:
  description: This documentation describes the Forgejo API.
  title: Forgejo Issue API
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: http://opensource.org/licenses/MIT
  version: 16.0.0-dev-785-465b60ef+gitea-1.22.0
servers:
- url: /api/v1
security:
- BasicAuth: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- name: Issue
paths:
  /repos/issues/search:
    get:
      tags:
      - Issue
      summary: Search for issues across the repositories that the user has access to
      operationId: issueSearchIssues
      parameters:
      - description: State of the issue
        name: state
        in: query
        schema:
          type: string
          enum:
          - open
          - closed
          - all
          default: open
      - description: Comma-separated list of label names. Fetch only issues that have any of these labels. Non existent labels are discarded.
        name: labels
        in: query
        schema:
          type: string
      - description: Comma-separated list of milestone names. Fetch only issues that have any of these milestones. Non existent milestones are discarded.
        name: milestones
        in: query
        schema:
          type: string
      - description: Search string
        name: q
        in: query
        schema:
          type: string
      - description: Repository ID to prioritize in the results
        name: priority_repo_id
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by issue type
        name: type
        in: query
        schema:
          type: string
          enum:
          - issues
          - pulls
      - description: Only show issues updated after the given time (RFC 3339 format)
        name: since
        in: query
        schema:
          type: string
          format: date-time
      - description: Only show issues updated before the given time (RFC 3339 format)
        name: before
        in: query
        schema:
          type: string
          format: date-time
      - description: Filter issues or pulls assigned to the authenticated user
        name: assigned
        in: query
        schema:
          type: boolean
          default: false
      - description: Filter issues or pulls created by the authenticated user
        name: created
        in: query
        schema:
          type: boolean
          default: false
      - description: Filter issues or pulls mentioning the authenticated user
        name: mentioned
        in: query
        schema:
          type: boolean
          default: false
      - description: Filter pull requests where the authenticated user's review was requested
        name: review_requested
        in: query
        schema:
          type: boolean
          default: false
      - description: Filter pull requests reviewed by the authenticated user
        name: reviewed
        in: query
        schema:
          type: boolean
          default: false
      - description: Filter by repository owner
        name: owner
        in: query
        schema:
          type: string
      - description: Filter by team (requires organization owner parameter)
        name: team
        in: query
        schema:
          type: string
      - description: Page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - description: Number of items per page
        name: limit
        in: query
        schema:
          type: integer
          minimum: 0
      - description: Type of sort
        name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - latest
          - oldest
          - recentupdate
          - leastupdate
          - mostcomment
          - leastcomment
          - nearduedate
          - farduedate
          default: latest
      responses:
        '200':
          $ref: '#/components/responses/IssueList'
        '400':
          $ref: '#/components/responses/error'
        '422':
          $ref: '#/components/responses/validationError'
  /repos/{owner}/{repo}/issues:
    get:
      tags:
      - Issue
      summary: List a repository's issues
      operationId: issueListIssues
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: whether issue is open or closed
        name: state
        in: query
        schema:
          type: string
          enum:
          - closed
          - open
          - all
      - description: comma separated list of labels. Fetch only issues that have any of this labels. Non existent labels are discarded
        name: labels
        in: query
        schema:
          type: string
      - description: search string
        name: q
        in: query
        schema:
          type: string
      - description: filter by type (issues / pulls) if set
        name: type
        in: query
        schema:
          type: string
          enum:
          - issues
          - pulls
      - description: comma separated list of milestone names or ids. It uses names and fall back to ids. Fetch only issues that have any of this milestones. Non existent milestones are discarded
        name: milestones
        in: query
        schema:
          type: string
      - description: Only show items updated after the given time. This is a timestamp in RFC 3339 format
        name: since
        in: query
        schema:
          type: string
          format: date-time
      - description: Only show items updated before the given time. This is a timestamp in RFC 3339 format
        name: before
        in: query
        schema:
          type: string
          format: date-time
      - description: Only show items which were created by the given user
        name: created_by
        in: query
        schema:
          type: string
      - description: Only show items for which the given user is assigned
        name: assigned_by
        in: query
        schema:
          type: string
      - description: Only show items in which the given user was mentioned
        name: mentioned_by
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      - description: Type of sort
        name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - latest
          - oldest
          - recentupdate
          - leastupdate
          - mostcomment
          - leastcomment
          - nearduedate
          - farduedate
          default: latest
      responses:
        '200':
          $ref: '#/components/responses/IssueList'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
    post:
      tags:
      - Issue
      summary: Create an issue.
      operationId: issueCreateIssue
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/Issue'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '412':
          $ref: '#/components/responses/error'
        '422':
          $ref: '#/components/responses/validationError'
        '423':
          $ref: '#/components/responses/repoArchivedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueOption'
  /repos/{owner}/{repo}/issues/comments:
    get:
      tags:
      - Issue
      summary: List all comments in a repository
      operationId: issueGetRepoComments
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: if provided, only comments updated since the provided time are returned.
        name: since
        in: query
        schema:
          type: string
          format: date-time
      - description: if provided, only comments updated before the provided time are returned.
        name: before
        in: query
        schema:
          type: string
          format: date-time
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/CommentList'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /repos/{owner}/{repo}/issues/comments/{id}:
    get:
      tags:
      - Issue
      summary: Get a comment
      operationId: issueGetComment
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the comment
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Comment'
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'
    delete:
      tags:
      - Issue
      summary: Delete a comment
      operationId: issueDeleteComment
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of comment to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
    patch:
      tags:
      - Issue
      summary: Edit a comment
      operationId: issueEditComment
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the comment to edit
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Comment'
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '423':
          $ref: '#/components/responses/repoArchivedError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditIssueCommentOption'
