openapi: 3.2.0
info:
  description: This documentation describes the Forgejo API.
  title: Forgejo Package API
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: http://opensource.org/licenses/MIT
  version: 16.0.0-dev-785-465b60ef+gitea-1.22.0
servers:
- url: /api/v1
security:
- BasicAuth: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- name: Package
paths:
  /packages/{owner}:
    get:
      tags:
      - Package
      summary: Gets all packages of an owner
      operationId: listPackages
      parameters:
      - description: owner of the packages
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      - description: package type filter
        name: type
        in: query
        schema:
          type: string
          enum:
          - alpine
          - cargo
          - chef
          - composer
          - conan
          - conda
          - container
          - cran
          - debian
          - generic
          - go
          - helm
          - maven
          - npm
          - nuget
          - pub
          - pypi
          - rpm
          - rubygems
          - swift
          - vagrant
      - description: name filter
        name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/PackageList'
        '404':
          $ref: '#/components/responses/notFound'
  /packages/{owner}/{type}/{name}/-/link/{repo_name}:
    post:
      tags:
      - Package
      summary: Link a package to a repository
      operationId: linkPackage
      parameters:
      - description: owner of the package
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: type of the package
        name: type
        in: path
        required: true
        schema:
          type: string
      - description: name of the package
        name: name
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository to link.
        name: repo_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
  /packages/{owner}/{type}/{name}/-/unlink:
    post:
      tags:
      - Package
      summary: Unlink a package from a repository
      operationId: unlinkPackage
      parameters:
      - description: owner of the package
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: type of the package
        name: type
        in: path
        required: true
        schema:
          type: string
      - description: name of the package
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
  /packages/{owner}/{type}/{name}/{version}:
    get:
      tags:
      - Package
      summary: Gets a package
      operationId: getPackage
      parameters:
      - description: owner of the package
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: type of the package
        name: type
        in: path
        required: true
        schema:
          type: string
      - description: name of the package
        name: name
        in: path
        required: true
        schema:
          type: string
      - description: version of the package
        name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Package'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Package
      summary: Delete a package
      operationId: deletePackage
      parameters:
      - description: owner of the package
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: type of the package
        name: type
        in: path
        required: true
        schema:
          type: string
      - description: name of the package
        name: name
        in: path
        required: true
        schema:
          type: string
      - description: version of the package
        name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
  /packages/{owner}/{type}/{name}/{version}/files:
    get:
      tags:
      - Package
      summary: Gets all files of a package
      operationId: listPackageFiles
      parameters:
      - description: owner of the package
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: type of the package
        name: type
        in: path
        required: true
        schema:
          type: string
      - description: name of the package
        name: name
        in: path
        required: true
        schema:
          type: string
      - description: version of the package
        name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/PackageFileList'
        '404':
          $ref: '#/components/responses/notFound'
