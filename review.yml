aid: codeberg
name: Codeberg
review:
  question: Does Codeberg expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Codeberg's public programmable surface is
    the Forgejo/Gitea-compatible REST API at https://codeberg.org/api/v1, which
    is request/response HTTPS. Forgejo's server-to-client eventing is delivered
    by outbound webhooks (the server POSTs JSON to a consumer-configured HTTP
    endpoint on repository, issue, and pull-request events) - not a WebSocket
    channel Codeberg exposes for clients to connect to. There is no documented
    wss:// endpoint and no server-push transport on Codeberg's own API to model.
findings:
  summary: |
    Codeberg does not publish a documented public WebSocket API. Codeberg is a
    community-run, non-profit Git hosting platform operated by Codeberg e.V. and
    built on Forgejo (a community fork of Gitea). Its programmable surface is the
    Forgejo/Gitea-compatible REST API served live at https://codeberg.org/api/v1,
    with a machine-readable Swagger 2.0 document at
    https://codeberg.org/swagger.v1.json and an interactive UI at
    https://codeberg.org/api/swagger. The running application self-reported
    version 15.0.0-209-2308e484+gitea-1.22.0 via GET /api/v1/version at review
    time. Authentication is by personal access token sent as
    `Authorization: token YOUR_TOKEN`, by OAuth2, or by HTTP Basic auth
    (optionally combined with a TOTP header when two-factor auth is enabled).
    Server-to-client events are delivered via configurable outbound webhooks, not
    a WebSocket. No realtime, bidirectional, or streaming WebSocket (ws:// or
    wss://) endpoint is documented on Codeberg's API.
  openSource: |
    Codeberg runs on Forgejo, a copyleft community fork of Gitea, and is itself a
    non-profit dedicated to free and open source software. The Forgejo software is
    open source (Forgejo relicensed the codebase under GPLv3; the Gitea lineage it
    forked from is MIT). The same REST API surface documented here is available on
    any self-hosted Forgejo or Gitea instance, not only on codeberg.org.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://codeberg.org/api/v1
      documented: true
      note: Forgejo/Gitea-compatible REST API. Live Swagger 2.0 at https://codeberg.org/swagger.v1.json.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Server POSTs JSON event payloads to a consumer-configured HTTP endpoint (repo/org/user hooks). Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Codeberg's API reference or Forgejo API as of the review date.
