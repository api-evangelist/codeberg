  confirmationNote: |
    The endpoint list was grounded in the live Swagger 2.0 document fetched from
    https://codeberg.org/swagger.v1.json (315 paths total; Forgejo API title,
    basePath /api/v1). The subset above and in the OpenAPI is drawn verbatim from
