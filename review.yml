actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Codeberg's own public API is
    request/response REST (Forgejo/Gitea-compatible) plus outbound webhooks for
    server-to-endpoint eventing. No AsyncAPI document was created because there is
    no client-facing server-push transport (WebSocket or SSE) on Codeberg's API
    to model.
